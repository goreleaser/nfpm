name: nfpm-pkg-test-postfail
arch: ${NFPM_PKG_TEST_ARCH}
version: 1.0.0
maintainer: "Test Company <test@example.com>"
description: "A package whose postinstall script fails"
contents:
  - src: ./dist/testapp
    dst: /usr/local/bin/nfpm-pkg-test-postfail
    file_info:
      mode: 0755
scripts:
  postinstall: ./testdata/acceptance/pkg/postinstall-fail.sh
pkg:
  identifier: dev.goreleaser.nfpm.pkgtest.postfail
