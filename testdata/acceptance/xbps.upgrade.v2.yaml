name: "foo"
arch: "${BUILD_ARCH}"
platform: "linux"
version: "v1.2.4"
release: "1"
maintainer: "Foo Bar"
description: |
  Foo bar
  Multiple lines
vendor: "foobar"
homepage: "https://foobar.org"
license: "MIT"
contents:
  - src: ./testdata/acceptance/xbps.current.v2.txt
    dst: /usr/share/foo/current.txt
  # Unchanged between the two versions and not owned by root: xbps leaves
  # the file in place on upgrade, and the generated INSTALL script must keep
  # its ownership.
  - src: ./testdata/acceptance/xbps.state.txt
    dst: /var/lib/foo/state
    file_info:
      mode: 0640
      owner: nobody
      group: nogroup
scripts:
  postinstall: ./testdata/acceptance/scripts/xbps/postinstall.sh
xbps:
  short_desc: "XBPS upgrade package"
  preserve: true
